<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>华电刷题 v2</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0710;--ink:#f2eaf6;--ink2:#cbbcd6;--muted:#95889f;
  --line:rgba(255,255,255,.09);--card:rgba(18,12,26,.52);
  --brand:#d946ef;--brand2:#a855f7;--brand-soft:rgba(217,70,239,.13);
  --ok:#34d399;--ok-soft:rgba(52,211,153,.13);
  --no:#fb7185;--no-soft:rgba(251,113,133,.13);
  --r-lg:18px;--r-md:13px;--r-sm:10px;
  --sh:0 24px 60px -24px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b0710}
body{margin:0;color:var(--ink);min-height:100vh;position:relative;
  font:15.5px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  letter-spacing:.01em;-webkit-font-smoothing:antialiased;padding:16px;
  background:
    radial-gradient(1100px 760px at 12% 6%, rgba(192,38,211,.30), transparent 62%),
    radial-gradient(900px 700px at 88% 14%, rgba(88,28,135,.42), transparent 64%),
    radial-gradient(1000px 900px at 50% 104%, rgba(219,39,119,.20), transparent 66%),
    #0b0710;
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;
  background:
    radial-gradient(closest-side, rgba(217,70,239,.20), transparent 70%),
    radial-gradient(closest-side, rgba(88,28,135,.22), transparent 70%);
  background-size:70% 70%,60% 60%;background-position:22% 28%,78% 70%;background-repeat:no-repeat;
  animation:drift 26s ease-in-out infinite alternate;filter:blur(28px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    radial-gradient(1.4px 1.4px at 18% 24%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.2px 1.2px at 62% 12%,rgba(255,214,255,.45),transparent),
    radial-gradient(1.6px 1.6px at 82% 58%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.2px 1.2px at 34% 78%,rgba(255,220,255,.40),transparent),
    radial-gradient(1.3px 1.3px at 72% 86%,rgba(255,255,255,.30),transparent),
    radial-gradient(1.1px 1.1px at 8% 60%,rgba(255,255,255,.28),transparent);
  animation:twinkle 7s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(3%,-4%,0) scale(1.08)}}
@keyframes twinkle{0%{opacity:.30}100%{opacity:.75}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.wrap{max-width:760px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;
  box-shadow:var(--sh);margin-bottom:14px;position:relative;overflow:hidden;
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  animation:rise .34s cubic-bezier(.2,.8,.3,1) both}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.07),transparent 42%);opacity:.7}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
h2{font-size:17px;font-weight:650;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 4px;text-align:center;transition:transform .18s ease,border-color .18s ease}
.stat:hover{transform:translateY(-2px);border-color:rgba(217,70,239,.35)}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(90deg,#f0abfc,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11.5px;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:15px}
.field:last-of-type{border-bottom:0}
.field select{flex:1;max-width:62%;height:42px;padding:0 12px;border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm);background:#1c1426;color:#f2eaf6;font-size:15px;font-family:inherit;
  transition:border-color .18s ease,box-shadow .18s ease;cursor:pointer}
.field select:hover{border-color:rgba(217,70,239,.45)}
.field select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(217,70,239,.22)}
.field select option{background:#1c1426;color:#f2eaf6;padding:8px}
.field select optgroup{background:#1c1426;color:#f0abfc}
button{border:0;border-radius:var(--r-md);padding:0 16px;height:50px;font-size:16px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:transform .14s ease,box-shadow .2s ease,filter .2s ease}
button:active{transform:scale(.985)}
.primary{background:linear-gradient(100deg,#a21caf,#7e22ce,#a21caf);background-size:200% 100%;
  color:#fff;width:100%;margin-top:16px;box-shadow:0 14px 34px -16px rgba(168,85,247,.85);
  animation:flow 6s linear infinite}
.primary:hover{filter:brightness(1.1)}
.ghost{background:rgba(255,255,255,.04);color:var(--ink2);border:1px solid var(--line);width:100%;
  margin-top:10px;font-weight:500;height:46px}
.ghost:hover{background:rgba(255,255,255,.08)}
.row{display:flex;gap:10px}.row>*{flex:1}
.pool{margin-top:14px;font-size:14px;color:var(--muted)}
.pool b{color:#e879f9;font-size:16px}
.rules{margin-top:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:var(--r-md);padding:13px 15px;font-size:13px;line-height:1.85;color:var(--ink2)}
.rules b{color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  color:var(--muted);letter-spacing:.02em}
.qhead span:first-child{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,#d946ef,#a855f7,#22d3ee,#d946ef);background-size:300% 100%;
  animation:flow 4s linear infinite;transition:width .4s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 0 12px rgba(217,70,239,.6)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11.5px;letter-spacing:.02em;border-radius:99px;padding:3px 10px;
  background:rgba(217,70,239,.14);color:#f0abfc;border:1px solid rgba(217,70,239,.22)}
.tag.t2{background:rgba(168,85,247,.14);color:#d8b4fe;border-color:rgba(168,85,247,.24)}
.tag.t3{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.22)}
.tag.t4{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.22)}
.stem{font-size:17px;line-height:1.78;font-weight:500;letter-spacing:.005em;margin-bottom:18px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;
  background:rgba(255,255,255,.045);border:1.5px solid rgba(255,255,255,.10);border-radius:var(--r-md);
  padding:14px 15px;font-size:15.5px;line-height:1.6;font-weight:400;color:var(--ink);height:auto;
  transition:border-color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease;
  animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.opt:hover{border-color:rgba(217,70,239,.55);background:rgba(217,70,239,.10);transform:translateY(-1px)}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;background:rgba(255,255,255,.09);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;margin-top:1px;
  transition:background .16s ease,color .16s ease}
.opt .t{flex:1;word-break:break-word}
.opt.sel{border-color:var(--brand);background:rgba(217,70,239,.16);
  box-shadow:0 0 0 3px rgba(217,70,239,.18),0 0 24px -6px rgba(217,70,239,.55)}
.opt.sel .k{background:var(--brand);color:#1a0b1f}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 22px -8px rgba(52,211,153,.7)}
.opt.right .k{background:var(--ok);color:#052e1c}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .k{background:var(--no);color:#3b0713}
.fb{margin-top:16px;border-radius:var(--r-md);padding:14px 16px;font-size:15px;line-height:1.75;
  border-left:4px solid;animation:pop .26s cubic-bezier(.2,.8,.3,1) both;backdrop-filter:blur(6px)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:#a7f3d0}
.fb.no{background:var(--no-soft);border-color:var(--no);color:#fecdd3;animation:pop .26s ease both,shake .32s ease .1s}
.fb .ansline{margin-top:8px;color:#fff;font-weight:650;font-size:15.5px;text-shadow:0 0 18px rgba(217,70,239,.45)}
.fb .why{margin-top:9px;color:var(--ink2);font-size:14px;line-height:1.8}
.fb .why b{color:#f0abfc}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1.05;
  background:linear-gradient(95deg,#f0abfc,#c084fc,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(217,70,239,.45))}
.sub{text-align:center;color:var(--muted);margin:8px 0 18px;font-size:14px}
.witem{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:9px;
  font-size:14px;line-height:1.7;background:rgba(255,255,255,.03);transition:border-color .18s ease}
.witem:hover{border-color:rgba(217,70,239,.3)}
.witem .q{font-weight:600;color:var(--ink2)}
.witem .a{color:#6ee7b7;margin-top:5px}
textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;
  font-size:13px;font-family:ui-monospace,Consolas,monospace;resize:vertical;
  background:rgba(0,0,0,.35);color:var(--ink)}
.hidden{display:none!important}
@media (max-width:640px){
  body{padding:10px;font-size:15px}
  .card{padding:16px;border-radius:16px;margin-bottom:10px}
  h1{font-size:20px}h2{font-size:16px}
  .stem{font-size:16.5px;line-height:1.8;margin-bottom:14px}
  .opt{min-height:60px;padding:15px 14px;font-size:16px;gap:11px}
  .opt .k{flex-basis:26px;height:26px;font-size:13px}
  button{height:52px;font-size:16.5px}
  .ghost{height:48px}
  .field{padding:11px 0;font-size:14.5px}
  .field select{height:46px;font-size:16px;max-width:60%}
  .statgrid{gap:6px;margin:12px 0 4px}
  .stat{padding:8px 2px}.stat b{font-size:17px}.stat span{font-size:10.5px}
  .fb{padding:13px 14px;font-size:14.5px}
  .fb .ansline{font-size:15px}.fb .why{font-size:13.5px}
  .big{font-size:44px}
  .tags{gap:5px;margin-bottom:11px}.tag{font-size:11px;padding:3px 9px}
  .witem{padding:11px 12px;font-size:13.5px}
  textarea{height:120px;font-size:12.5px}
}
@media (max-width:400px){.statgrid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){
  body::before,body::after,.primary,.bar i{animation:none}
  .card,.opt,.fb{animation-duration:.01s}
}
@supports(padding:max(0px)){
  body{padding-top:max(10px,env(safe-area-inset-top));
       padding-bottom:max(10px,env(safe-area-inset-bottom));
       padding-left:max(10px,env(safe-area-inset-left));
       padding-right:max(10px,env(safe-area-inset-right))}
}

.bgvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:60% 35%;z-index:0;pointer-events:none;
  filter:brightness(.66) saturate(1.06) contrast(1.03);
  transform:scale(1.01);will-change:transform}
@media (max-width:640px){.bgvideo{object-position:62% 30%}}
.bgveil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1300px 800px at 46% 0%, rgba(255,196,120,.08), transparent 64%),
    radial-gradient(1000px 900px at 50% 118%, rgba(120,40,90,.30), transparent 68%),
    linear-gradient(180deg, rgba(11,7,16,.30), rgba(11,7,16,.56))}
#soundBtn{font-size:13px;position:relative;transition:background .22s ease,color .22s ease,box-shadow .22s ease,opacity .22s ease}
#soundBtn.on{background:linear-gradient(100deg,#d946ef,#a855f7)!important;color:#fff!important;
  border-color:transparent!important;font-weight:650;
  animation:sndPulse 2.2s ease-in-out infinite}
#soundBtn.on::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;
  border:1.5px solid rgba(240,171,252,.75);animation:sndRing 2.2s ease-out infinite}
#soundBtn:not(.on){opacity:.7}
@keyframes sndPulse{0%,100%{box-shadow:0 0 0 2px rgba(217,70,239,.26),0 8px 22px -10px rgba(217,70,239,.85)}
  50%{box-shadow:0 0 0 3px rgba(217,70,239,.45),0 14px 34px -8px rgba(217,70,239,1)}}
@keyframes sndRing{0%{transform:scale(1);opacity:.65}100%{transform:scale(1.16);opacity:0}}
.volrow.bgm-off input[type=range]{opacity:.3;filter:grayscale(.7)}
.volrow.bgm-off .vlabel{opacity:.4}
.sndtip{margin-top:8px;font-size:12px;color:#f0abfc;display:none}
.sndtip.show{display:block}
#beepBtn{font-size:12px;padding:0 10px;height:32px;border-radius:9px;flex:0 0 auto}
.volrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.volrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;
  background:linear-gradient(90deg,#d946ef,#a855f7);outline:0}
.volrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px rgba(217,70,239,.9);cursor:pointer}
.volrow input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.volrow .vlabel{font-size:12.5px;color:#f0abfc;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<video id="bgv" class="bgvideo" src="bg-loop.mp4" autoplay muted loop playsinline preload="auto"></video>
<div class="bgveil"></div><div class="wrap">

<section id="home" class="card">
  <h1>华电刷题 · v2</h1>
  <div class="muted">共 <b id="s-total">0</b> 题 ｜ 数据存本机浏览器</div>
  <div class="statgrid">
    <div class="stat"><b id="s-done">0</b><span>已掌握</span></div>
    <div class="stat"><b id="s-wrong">0</b><span>待复习</span></div>
    <div class="stat"><b id="s-acc">—</b><span>总正确率</span></div>
    <div class="stat"><b id="s-rounds">0</b><span>轮次</span></div>
  </div>
  <label class="field"><span>题库</span><select id="bankSel"></select></label>
  <label class="field"><span>方向</span><select id="dirSel"></select></label>
  <label class="field"><span>每轮题量</span><select id="countSel">
    <option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option>
  </select></label>
  <div class="muted" style="margin-top:10px">当前范围剩余未掌握：<b id="poolLeft" style="color:#2563eb">0</b> 题</div>
  <button class="primary" id="startBtn">开始练习</button>
  <div class="row" style="margin-top:9px">
    <button class="ghost" id="wrongBookBtn" style="margin-top:0">错题本</button>
    <button class="ghost" id="ioBtn" style="margin-top:0">导出/导入</button>
    <button class="ghost" id="soundBtn" style="margin-top:0">🔇 环境音</button>
  </div>
  <div class="volrow">
    <span class="muted" style="font-size:12.5px">音量</span>
    <input type="range" id="volRange" min="0" max="100" value="85">
    <span class="vlabel" id="volLabel">85%</span>
    <button id="beepBtn" class="ghost" style="margin:0">测试</button>
  </div>
  <div class="muted" style="margin-top:12px;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px;line-height:1.8">
    · 答对 → 自动下一题，记入「已掌握」不再出现<br>
    · 答错 → 显示<b>正确答案全文</b>＋<b>原因</b>（解析或依据卡），手动下一题<br>
    · 错题下一轮最多占一半名额，其余给新题
  </div>
</section>

<section id="quiz" class="card hidden">
  <div class="qhead"><span id="qProg"></span><span id="qAcc"></span></div>
  <div class="bar"><i id="qBar"></i></div>
  <div class="tags"><span class="tag" id="qBank"></span><span class="tag t2" id="qDir"></span><span class="tag t3" id="qType"></span></div>
  <div class="stem" id="qStem"></div>
  <div class="opts" id="qOpts"></div>
  <div class="fb hidden" id="qFb"></div>
  <button class="primary hidden" id="submitBtn">提交答案</button>
  <button class="primary hidden" id="nextBtn">下一题</button>
  <button class="ghost" id="quitBtn">结束本轮</button>
</section>

<section id="result" class="card hidden">
  <h2>本轮结束</h2>
  <div class="big" id="rAcc">—</div>
  <div class="sub" id="rSub"></div>
  <div id="rWrongList"></div>
  <button class="primary" id="againBtn">再来一轮</button>
  <button class="ghost" id="homeBtn">返回首页</button>
</section>

<section id="book" class="card hidden">
  <h2>错题本</h2>
  <div class="muted" id="bookCount"></div>
  <div id="bookList" style="margin-top:12px;max-height:60vh;overflow:auto"></div>
  <button class="primary" id="drillBtn">只刷错题</button>
  <button class="ghost" id="bookBack">返回</button>
</section>

<section id="io" class="card hidden">
  <h2>导出 / 导入进度</h2>
  <div class="muted">导出后复制这段文本存好；换设备或清缓存后粘回来即可恢复。</div>
  <textarea id="ioText" spellcheck="false"></textarea>
  <button class="primary" id="copyBtn">复制导出的进度</button>
  <button class="ghost" id="importBtn">把框里的文本导入</button>
  <button class="ghost" id="ioBack">返回</button>
</section>

<script>

超前-滞后）。PID 中 P 管响应速度、I 消稳态误差、D 抑超调。PLC 扫描周期：输入采样→程序执行→输出刷新。","供用电技术":"负荷计算用需要系数法/二项式法；无功补偿按功率因数目标反算容量 Qc=P(tanφ1−tanφ2)。短路电流计算用于选设备（动稳定、热稳定校验）。电能质量问题：谐波、电压偏差、三相不平衡、电压暂降。接地分工作接地、保护接地、防雷接地，TN/TT/IT 三种系统按中性点与外壳接地方式区分。"};

function poolOf(bank, dir) {
  var out = [];
  for (var i = 0; i < BANK.length; i++) {
    var q = BANK[i];
    if (bank !== "all" && q.bank !== bank) continue;
    if (dir !== "all" && q.dir !== dir) continue;
    if (S.archived[q.id]) continue;
    out.push(q);
  }

function pick(bank, dir, n) {
  var p = poolOf(bank, dir), w = [], f = [];
  for (var i = 0; i < p.length; i++) { (S.wrong[p[i].id] ? w : f).push(p[i]); }

  var out = w.slice(0, Math.min(w.length, cap));
  if (out.length < n) out = out.concat(f.slice(0, n - out.length));
  if (out.length < n) out = out.concat(w.slice(Math.min(w.length, cap), n));
  return shuffle(out);
}

function textOf(q, L) { var i = "ABCD".indexOf(L); return i >= 0 && i < q.opts.length ? q.opts[i] : ""; }
function judge() {
  if (locked) return;
  locked = true;
  var q = cur, multi = q.ans.length > 1;
  var mine = Object.keys(sel).filter(function (k) { return sel[k]; }).sort().join("");
  var right = q.ans.split("").sort().join("");
  var ok = mine === right;
  var btns = document.querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) {
    var L = btns[i].getAttribute("data-k"), cls = "opt";
    if (right.indexOf(L) >= 0) cls += " right";
    else if (mine.indexOf(L) >= 0) cls += " wrong";
    btns[i].className = cls; btns[i].disabled = true;
  }
  var fb = $("qFb"); fb.className = "fb " + (ok ? "ok" : "no"); fb.innerHTML = "";
  var line = document.createElement("div");
  line.textContent = ok ? "✓ 答对了" : "✗ 答错了";
  fb.appendChild(line);
  var ans = document.createElement("div"); ans.className = "ansline";
  var parts = [];
  for (var j = 0; j < right.length; j++) parts.push(right[j] + ". " + textOf(q, right[j]));
  ans.textContent = "正确答案：" + parts.join("　");
  fb.appendChild(ans);
  if (!ok && multi) {
    var missed = right.split("").filter(function (c) { return mine.indexOf(c) < 0; });
    var extra = mine.split("").filter(function (c) { return right.indexOf(c) < 0; });
    var t = [];
    if (missed.length) t.push("漏选 " + missed.length + " 项（" + missed.join("") + "）");
    if (extra.length) t.push("多选 " + extra.length + " 项（" + extra.join("") + "）");
    if (t.length) { var d2 = document.createElement("div"); d2.className = "why"; d2.textContent = "错因：" + t.join("；"); fb.appendChild(d2); }
  }
  if (q.exp) {
    var e1 = document.createElement("div"); e1.className = "why";
    e1.innerHTML = "<b>解析：</b>"; e1.appendChild(document.createTextNode(q.exp));
    fb.appendChild(e1);
  }
  var ap = q.allPick;
  if (ok) {
    sess.correct++; S.correct++;
    if (ap) { S.apSeen = (S.apSeen || 0) + 1; S.apCorrect = (S.apCorrect || 0) + 1; }
    delete S.wrong[q.id]; S.archived[q.id] = true;
    var tip = document.createElement("div");
    tip.style.cssText = "margin-top:9px;color:#64748b;font-size:13.5px";
    tip.textContent = "10 秒后自动进入下一题（点此立即跳）";
    fb.appendChild(tip);
    fb.onclick = doSkip;
    if (skipTimer) clearTimeout(skipTimer);
    skipTimer = setTimeout(doSkip, 10000);
  } else {
    sess.wrongs.push(q);
    S.wrong[q.id] = (S.wrong[q.id] || 0) + 1;
    delete S.archived[q.id];
    $("nextBtn").className = "primary";
    $("submitBtn").className = "primary hidden";
  }
  if (ap) { sess.apAll++; S.apSeen = (S.apSeen || 0) + 1; if (ok) sess.apOk++; }
  S.seen++; save();
  $("qAcc").textContent = "正确率 " + Math.round(sess.correct / (sess.idx + 1) * 100) + "%";
}
function nextQ() { sess.idx++; if (sess.idx >= sess.list.length) { finish(); return; } renderQ(); }
function finish() {
  S.rounds = (S.rounds || 0) + 1; save();
  var total = sess.list.length, ok = sess.correct;
  var real = total - sess.apAll, realOk = ok - sess.apOk;
  $("rAcc").textContent = (real > 0 ? Math.round(realOk / real * 100) : 0) + "%";
  var s = "本轮 " + total + " 题 · 对 " + ok + " · 错 " + (total - ok);
  if (sess.apAll) s += "　（其中送分「全选题」" + sess.apAll + " 道已单列）";
  $("rSub").textContent = s;
  var wl = $("rWrongList"); wl.innerHTML = "";
  if (sess.wrongs.length) {
    var h = document.createElement("h2"); h.style.fontSize = "15px"; h.style.margin = "18px 0 9px";
    h.textContent = "本轮错题（下一轮最多占一半名额）"; wl.appendChild(h);
    for (var i = 0; i < sess.wrongs.length; i++) {

      var d = document.createElement("div"); d.className = "witem";
      var a = document.createElement("div"); a.className = "q"; a.textContent = q.stem;
      var b = document.createElement("div"); b.className = "a";

      b.textContent = "正确答案：" + ps.join("　") + (q.exp ? "　｜ " + q.exp : "");
      d.appendChild(a); d.appendChild(b); wl.appendChild(d);

  show("result");
}

$("homeBtn").onclick = function () { 
var bgv = document.getElementById("bgv");
var soundBtn = document.getElementById("soundBtn");
var volRange = document.getElementById("volRange");
var volLabel = document.getElementById("volLabel");
var actx = null, gainNode = null, mediaSrc = null;
function ensureAudio() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!actx) {
      actx = new AC();
      mediaSrc = actx.createMediaElementSource(bgv);
      gainNode = actx.createGain();
      gainNode.gain.value = 2.4;
      mediaSrc.connect(gainNode);
      gainNode.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    return true;
  } catch (e) { return false; }
}
function applyVol() {
  var v = parseInt(volRange.value, 10) / 100;
  if (gainNode) { gainNode.gain.value = v * 3.0; }
  else { try { bgv.volume = v; } catch (e) {} }
  volLabel.textContent = volRange.value + "%";
  if (!bgv.muted) soundBtn.textContent = "🔊 环境音 · 开 " + volRange.value + "%";
}
var volRow = volRange ? volRange.parentNode : null;
function syncSoundUI() {
  if (!soundBtn) return;
  if (bgv.muted) {
    soundBtn.className = "ghost";
    soundBtn.textContent = "🔇 环境音 · 已关";
    if (volRow) volRow.className = "volrow bgm-off";
  } else {
    soundBtn.className = "ghost on";
    soundBtn.textContent = "🔊 环境音 · 开 " + volRange.value + "%";
    if (volRow) volRow.className = "volrow";
  }
}
if (bgv && volRange) {
  applyVol();
  syncSoundUI();
  volRange.oninput = function () { applyVol(); syncSoundUI(); };
  soundBtn.onclick = function () {
    if (!bgv.muted) { bgv.muted = true; syncSoundUI(); return; }
    var ok = ensureAudio();
    bgv.muted = false;
    applyVol();
    var pr = bgv.play();
    if (pr && pr.catch) pr.catch(function () {});
    syncSoundUI();
    if (!ok) soundBtn.textContent = "⚠️ 音频被限制";
  };
  bgv.addEventListener("volumechange", syncSoundUI);
}
function testBeep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { alert("浏览器不支持 AudioContext"); return; }
    var ctx = new AC();
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 880;
    g.gain.value = 0.25;
    osc.connect(g).connect(ctx.destination);
    osc.start();
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.stop(ctx.currentTime + 0.5);
    osc.onended = function () { try { ctx.close(); } catch (e) {} };
  } catch (e) { alert("测试音失败：" + e.message); }
}
